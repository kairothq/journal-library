<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Albert+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#f3e6cf; --fade:rgba(243,230,207,.55); --acc:#d9a35b; --bg:#110c08; }
  :root[data-theme="light"] { --ink:#f8ecdb; --fade:rgba(248,236,219,.72); --acc:#f2b27a; --bg:#4e4038; }
  html,body,#hud h1,#crumbs,#crumbs b,#hint,#back,#otd,#add,#set,#demo,#tip,#hud { transition:color 1.6s ease, background-color 1.6s ease, border-color 1.6s ease, opacity .4s; }
  :root[data-theme="light"] #back, :root[data-theme="light"] #otd, :root[data-theme="light"] #add, :root[data-theme="light"] #set, :root[data-theme="light"] #tip { background:rgba(48,34,24,.42); border-color:rgba(242,178,122,.45); }
  :root { --serif:"Young Serif",Georgia,serif; --sans:"Albert Sans",system-ui,sans-serif; --hand:Caveat,cursive; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:var(--sans); color:var(--ink); }
  canvas#gl { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:18px; left:20px; display:flex; align-items:center; gap:14px; z-index:5; }
  #hud h1 { margin:0; font:400 24px var(--serif); }
  #home { all:unset; cursor:pointer; color:var(--ink); border-radius:6px; padding:2px 4px; }
  #home:hover { color:var(--acc); }
  #home:focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  #add { color:var(--acc); text-decoration:none; font:600 13px var(--sans); border:1px solid rgba(217,163,91,.45); padding:7px 12px; border-radius:999px; background:rgba(20,14,9,.6); }
  #set { color:var(--ink); text-decoration:none; font:600 13px var(--sans); border:1px solid rgba(239,227,207,.32); padding:7px 12px; border-radius:999px; background:rgba(20,14,9,.6); }
  #set:hover { border-color:var(--ink); background:rgba(239,227,207,.1); }
  #add:hover { background:rgba(217,163,91,.15); }
  #back { display:none; border:1px solid rgba(243,230,207,.25); background:rgba(20,14,9,.6); color:var(--ink); font:500 13px var(--sans); padding:7px 12px; border-radius:999px; cursor:pointer; backdrop-filter:blur(6px); }
  #back:hover { border-color:var(--acc); }
  #crumbs { font:500 13px var(--sans); color:var(--fade); }
  #crumbs b { color:var(--ink); font-weight:600; }
  #otd { position:fixed; top:16px; right:20px; z-index:5; border:1px solid rgba(217,163,91,.5); background:rgba(20,14,9,.6); color:var(--acc); font:600 13px var(--sans); padding:8px 14px; border-radius:999px; cursor:pointer; backdrop-filter:blur(6px); }
  #otd:hover { background:rgba(217,163,91,.15); }
  #hint { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); font:500 13px var(--sans); color:var(--fade); z-index:5; pointer-events:none; transition:opacity .4s; text-align:center; padding:0 16px; }
  #tip { position:fixed; pointer-events:none; z-index:6; background:rgba(20,14,9,.85); border:1px solid rgba(243,230,207,.18); padding:8px 12px; border-radius:10px; font:500 12px var(--sans); opacity:0; transition:opacity .15s; white-space:nowrap; }
  #tip b { font:400 17px var(--serif); display:block; }
  #lb { position:fixed; inset:0; background:rgba(8,5,3,.9); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:10; cursor:zoom-out; }
  #lb img { max-width:92vw; max-height:86vh; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #lb div { font:600 22px Caveat,cursive; color:var(--ink); }
  #ed { position:fixed; top:64px; right:max(16px, calc(50vw - 640px)); width:min(430px, calc(100vw - 32px)); max-height:calc(100vh - 88px); overflow:auto; z-index:11;
    background:#f3ead8; color:#2f2418; border-radius:12px; padding:20px 22px 18px; box-shadow:0 30px 80px -20px rgba(0,0,0,.65); font:15px/1.5 var(--sans); }
  #ed[hidden] { display:none; }
  #ed header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  #ed h2 { font:400 22px var(--serif); margin:0; flex:1; }
  #ed .star, #ed .x { border:0; background:none; cursor:pointer; font-size:24px; line-height:1; color:#8a7560; width:36px; height:36px; border-radius:50%; }
  #ed .star[aria-pressed="true"] { color:#b07d12; }
  #ed .star:hover, #ed .x:hover { background:rgba(47,36,24,.08); }
  #ed label, #ed .lab { display:block; font-weight:600; font-size:13px; color:#6b5a48; margin:12px 0 0; }
  #ed input, #ed textarea { display:block; width:100%; margin-top:5px; background:#fffaf0; color:#2f2418; border:1px solid rgba(47,36,24,.16); border-radius:8px; padding:8px 10px; font:400 15px/1.5 var(--sans); resize:vertical; }
  #ed #edText { font:400 18px/1.45 Caveat,cursive; }
  #ed input:focus, #ed textarea:focus { outline:2px solid #8a3b22; outline-offset:1px; }
  .spaces, .inside .row { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  .pill { display:inline-flex; align-items:center; gap:7px; border:1px solid rgba(47,36,24,.16); background:#fffaf0; color:#2f2418; border-radius:999px; padding:6px 12px; font:500 14px var(--sans); cursor:pointer; }
  .pill i { width:10px; height:10px; border-radius:50%; border:2.5px solid var(--c); box-sizing:border-box; }
  .pill[aria-pressed="true"] { border-color:#2f2418; box-shadow:inset 0 0 0 1px #2f2418; }
  .pill[aria-pressed="true"] i { background:var(--c); }
  .pill.focus { outline:2px dashed rgba(138,59,34,.45); outline-offset:2px; }
  .pill.new { border-style:dashed; color:#6b5a48; background:none; }
  .pill input { all:unset; width:120px; font:500 14px var(--sans); }
  .inside { background:rgba(47,36,24,.06); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .inside[hidden] { display:none; }
  .inside p { margin:0; font-size:13px; color:#6b5a48; }
  #ed .pics { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; } #ed .pics img { height:64px; border-radius:4px; }
  #ed footer { display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  #ed .save { border:0; background:#2f2418; color:#f3ead8; border-radius:8px; padding:10px 18px; font:600 14px var(--sans); cursor:pointer; }
  #ed .ghost { border:0; background:none; color:#8a3b22; font:600 14px var(--sans); border-bottom:1px solid currentColor; cursor:pointer; padding:0; }
  #ed footer span { color:#8a7560; font-size:12px; margin-left:auto; }
  #demo { border:1px solid rgba(239,227,207,.32); background:rgba(20,14,9,.6); color:var(--ink); font:600 13px var(--sans); padding:7px 12px; border-radius:999px; cursor:pointer; }
  #demo:hover { border-color:var(--ink); background:rgba(239,227,207,.1); }
  :root[data-theme="light"] #demo { background:rgba(48,34,24,.42); border-color:rgba(242,178,122,.45); }
  body.demo #hud, body.demo #otd, body.demo #hint, body.demo #tip { opacity:0 !important; pointer-events:none; }
  body.demo canvas#gl { cursor:none !important; }
  #fade { position:fixed; inset:0; background:#000; z-index:15; pointer-events:none; opacity:0; transition:opacity .7s ease; }
  #dcur { position:fixed; left:0; top:0; z-index:16; pointer-events:none; opacity:0; transition:opacity .3s; will-change:transform; }
  #dcur svg { display:block; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  #dcur i { position:absolute; left:-17px; top:-17px; width:34px; height:34px; border-radius:50%; border:2px solid rgba(255,236,210,.95); opacity:0; }
  #dcur i.go { animation:ripple .55s ease-out; }
  @keyframes ripple { from { transform:scale(.3); opacity:1; } to { transform:scale(1.6); opacity:0; } }
  #dpause { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:17; display:none; gap:18px; align-items:center; background:rgba(20,14,9,.82); color:var(--ink); border:1px solid rgba(239,227,207,.25); border-radius:999px; padding:10px 20px; font:500 14px var(--sans); backdrop-filter:blur(6px); white-space:nowrap; }
  #dpause.on { display:flex; }
  #dpause b { font-weight:600; }
  #dpause kbd { font:600 12px var(--sans); border:1px solid rgba(239,227,207,.35); border-radius:5px; padding:2px 6px; margin-right:5px; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font:italic 500 22px "Cormorant Garamond",serif; color:var(--fade); z-index:20; background:var(--bg); transition:opacity .6s; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="/theme.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><h1><button id="home" title="Back to the shelves">Library</button></h1><a id="add" href="/add">+ Add pages</a><a id="set" href="/settings" aria-label="Settings">Settings</a><button id="demo" title="Plays a short tour for recording">▶ Demo</button><button id="back">‹ Back</button><div id="crumbs"></div></div>
<button id="otd"></button>
<div id="hint">Click a year to open it. Scroll down for your category books.</div>
<div id="tip"></div>
<div id="lb"><img alt=""><div></div></div>
<aside id="ed" hidden aria-labelledby="edDate">
  <header><h2 id="edDate"></h2><button id="edStar" class="star" aria-pressed="false" aria-label="Star this page">☆</button><button class="x" id="edX" aria-label="Close">×</button></header>
  <label>Title<input id="edTitle" placeholder="A title, if you like"></label>
  <label>What it says<textarea id="edText" rows="7"></textarea></label>
  <label>Your note<textarea id="edNote" rows="3" placeholder="Why does this page matter? (optional)"></textarea></label>
  <div class="lab" id="edCatsLab">Categories</div>
  <div class="spaces" id="edSpaces"></div>
  <div class="inside" id="edInside" hidden></div>
  <div class="pics" id="edPics"></div>
  <footer><button class="save" id="edSave">Save</button><button class="ghost" id="edPhoto">Add a photo</button><span>⌘ Enter saves</span></footer>
</aside>
<input type="file" id="attachIn" accept="image/*,.heic" multiple hidden>
<div id="fade"></div>
<div id="dpause" role="status"><b>Paused</b><span><kbd>Space</kbd>play</span><span><kbd>R</kbd>restart</span><span><kbd>Esc</kbd>exit</span></div>
<div id="dcur"><i></i><svg width="26" height="30" viewBox="0 0 26 30"><path d="M3 2 L3 24 L9 18.5 L13 27.5 L17 25.8 L13 17 L21 17 Z" fill="#fff8ee" stroke="#1a120d" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<div id="load">Dusting the shelf…</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = s => document.querySelector(s);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS = MONTHS.map(m => m.slice(0, 3));
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const TODAY = new Date(), todayStr = iso(TODAY), thisYear = TODAY.getFullYear();
const nice = (ds, yr = true) => { const [y,m,d] = ds.split('-').map(Number); return `${WD[new Date(y,m-1,d).getDay()]}, ${d} ${MS[m-1]}${yr ? ' ' + y : ''}`; };
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });

// ---------- state ----------
let cur = null, busy = false, hoverId = null, spots = { L: [], R: [] }, stack = [];
let mode = 'shelf', reading = null, hoverBook = null;

// ---------- data ----------
const data = await fetch('/data.json').then(r => r.json());
const pages = data.pages.filter(p => !p.dropped && p.date && (p.image || p.typed));
const byDate = {};
for (const p of pages) (byDate[p.date] ??= []).push(p);
let ALLP = pages, CATS = data.categories || [];
const byId = Object.fromEntries(pages.map(p => [p.id, p]));
const YEARS = [];
for (let y = thisYear - 5; y <= thisYear; y++) YEARS.push(y);
const imgs = {};
function preload(list) { for (const p of list) for (const src of [p.image && p.id, ...(p.attachments || [])].filter(Boolean)) { if (imgs[src]) continue; const im = new Image(); im.onload = () => { if (cur && !busy) redraw(); }; im.src = '/' + (src === p.id ? p.image : src); imgs[src] = im; } }
preload(pages);

const HANDF = (window.JR && JR.hand) || 'Caveat';
await Promise.all([`600 60px "${HANDF}"`, '600 60px Caveat','700 60px "Cormorant Garamond"','600 60px "Cormorant Garamond"','italic 500 40px "Cormorant Garamond"'].map(f => document.fonts.load(f)));

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x110c08);
scene.fog = new THREE.Fog(0x110c08, 10, 22);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);
const CAM = new THREE.Vector3(0, 1.55, 7.4), LOOK = new THREE.Vector3(0, 1.35, 0);
camera.position.copy(CAM);

scene.add(new THREE.HemisphereLight(0xffe6c4, 0x1a0f07, 0.55));
const spot = new THREE.SpotLight(0xffd6a0, 260, 30, 0.62, 0.65, 1.6);
spot.position.set(1.8, 7, 6.5); spot.target.position.set(0, 1.1, -0.6);
spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.bias = -0.0004; spot.shadow.normalBias = 0.02;
scene.add(spot, spot.target);
const rim = new THREE.PointLight(0xff9b52, 14, 9, 1.6); rim.position.set(-3.2, 3.6, 1.2); scene.add(rim);
const fill = new THREE.PointLight(0xfff2de, 0, 12, 1.4); scene.add(fill);

const tex = (c, srgb = true, rep) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); } return t; };

// ---------- procedural textures ----------
function grain(c, amt) { const x = c.getContext('2d'), d = x.getImageData(0, 0, c.width, c.height); for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - .5) * amt; d.data[i] += n; d.data[i+1] += n; d.data[i+2] += n; } x.putImageData(d, 0, 0); return c; }
function wood(base = '#4a2f1b') {
  const c = mk(1024, 256), x = c.getContext('2d'); x.fillStyle = base; x.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 180; i++) { const y = Math.random() * 256; x.strokeStyle = `rgba(${20+Math.random()*40},${10+Math.random()*20},4,${.12+Math.random()*.3})`; x.lineWidth = .5 + Math.random() * 2.5; x.beginPath(); x.moveTo(0, y); for (let X = 0; X <= 1024; X += 32) x.lineTo(X, y + Math.sin(X / 140 + i) * 3 + Math.random() * 1.2); x.stroke(); }
  return grain(c, 14);
}
function leather(color, w = 256, h = 256) { const c = mk(w, h), x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, w, h); return grain(c, 22); }
const GOLD = (x, y0, y1) => { const g = x.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#f1d48a'); g.addColorStop(.5, '#b98d3e'); g.addColorStop(1, '#e6c06e'); return g; };

function spineArt(color, w, h, year) {
  const col = leather(color, w, h), met = mk(w, h);
  const draws = (x, ink) => {
    const band = (y, hh) => { x.fillStyle = ink; x.fillRect(10, y, w - 20, hh); };
    band(54, 5); band(66, 2); band(h - 59, 5); band(h - 68, 2);
    if (year) {
      band(150, 2); band(h - 150, 2);
      x.save(); x.translate(w / 2, h / 2); x.rotate(Math.PI / 2); x.fillStyle = ink; x.textAlign = 'center'; x.textBaseline = 'middle';
      let fs = Math.round(w * .62); x.font = `700 ${fs}px "Cormorant Garamond"`;
      const tw = x.measureText(String(year)).width; if (tw > h - 340) { fs = Math.floor(fs * (h - 340) / tw); x.font = `700 ${fs}px "Cormorant Garamond"`; }
      x.fillText(String(year), 0, 2); x.restore();
      x.fillStyle = ink; x.font = `italic 500 ${Math.round(w * .2)}px "Cormorant Garamond"`; x.textAlign = 'center'; x.fillText('Journal', w / 2, 118); x.fillText('✦', w / 2, h - 100);
    }
  };
  const cx = col.getContext('2d');
  // raised ribs
  for (const y of [110, h - 110]) { const g = cx.createLinearGradient(0, y - 10, 0, y + 10); g.addColorStop(0, 'rgba(0,0,0,.25)'); g.addColorStop(.5, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(0,0,0,.25)'); cx.fillStyle = g; cx.fillRect(0, y - 10, w, 20); }
  const sh = cx.createLinearGradient(0, 0, w, 0); sh.addColorStop(0, 'rgba(0,0,0,.35)'); sh.addColorStop(.45, 'rgba(255,255,255,.06)'); sh.addColorStop(1, 'rgba(0,0,0,.4)'); cx.fillStyle = sh; cx.fillRect(0, 0, w, h);
  draws(cx, GOLD(cx, 0, h));
  const mx = met.getContext('2d'); mx.fillStyle = '#000'; mx.fillRect(0, 0, w, h); draws(mx, '#fff');
  return { col, met };
}
function coverArt(color, year) {
  const w = 700, h = 1000, col = leather(color, w, h), met = mk(w, h);
  const draws = (x, ink) => {
    x.strokeStyle = ink; x.lineWidth = 6; x.strokeRect(38, 38, w - 76, h - 76); x.lineWidth = 2; x.strokeRect(56, 56, w - 112, h - 112);
    x.fillStyle = ink; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    let fs = 170; x.font = `700 ${fs}px "Cormorant Garamond"`; while (x.measureText(String(year)).width > w - 150 && fs > 40) { fs -= 6; x.font = `700 ${fs}px "Cormorant Garamond"`; }
    x.fillText(String(year), w / 2, 470);
    x.font = 'italic 500 64px "Cormorant Garamond"'; x.fillText('Journal', w / 2, 560);
    x.fillRect(w / 2 - 90, 610, 180, 3); x.font = '500 40px "Cormorant Garamond"'; x.fillText('✦', w / 2, 690);
  };
  const cx = col.getContext('2d'); const v = cx.createRadialGradient(w/2, h/2, 100, w/2, h/2, 700); v.addColorStop(0, 'rgba(255,255,255,.05)'); v.addColorStop(1, 'rgba(0,0,0,.35)'); cx.fillStyle = v; cx.fillRect(0, 0, w, h);
  draws(cx, GOLD(cx, 300, 700));
  const mx = met.getContext('2d'); mx.fillStyle = '#000'; mx.fillRect(0, 0, w, h); draws(mx, '#fff');
  return { col, met };
}
function pageEdges() { const c = mk(64, 512), x = c.getContext('2d'); x.fillStyle = '#efe4cb'; x.fillRect(0, 0, 64, 512); for (let i = 0; i < 512; i += 2) { x.fillStyle = `rgba(120,95,60,${Math.random() * .18})`; x.fillRect(0, i, 64, 1); } return c; }
const EDGE = tex(pageEdges());

// ---------- bookcase ----------
const woodMat = new THREE.MeshStandardMaterial({ map: tex(wood(), true, [2, 1]), roughness: .75, metalness: 0, envMapIntensity: .3 });
const backMat = new THREE.MeshStandardMaterial({ map: tex(wood('#2c1b10'), true, [1, 3]), roughness: .9, envMapIntensity: .2 });
const box = (w, h, d, m, x, y, z, cast = true) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; scene.add(o); return o; };
box(7.9, 10, .1, backMat, 0, .6, -2.05, false);
for (const y of [-2.66, .14, 3.02, 5.9]) box(7.9, .14, 2.15, woodMat, 0, y, -1, true);
for (const x of [-3.98, 3.98]) box(.16, 10, 2.25, woodMat, x, .6, -.98, true);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x1b120b, roughness: 1 })); wall.position.set(0, 2, -2.2); wall.receiveShadow = true; scene.add(wall);

// ---------- books ----------
const SHELF = [-2.59, .21, 3.09];
const PAL = ['#2f4a3a', '#6b2a2a', '#233452', '#7a5430', '#4a2140', '#2c3a3f', '#5b4a2a', '#3d2a1e', '#1f3b36', '#6a3b22'];
const YCOL = ['#28433a', '#5e2424', '#20304d', '#71492a', '#4f1f3b', '#2a2d33'];

function buildBook({ W, H, T, color, year }) {
  const book = new THREE.Group();
  const lm = new THREE.MeshStandardMaterial({ map: tex(leather(color)), roughness: .62, envMapIntensity: .5 });
  const add = (parent, geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
  add(book, new THREE.BoxGeometry(W, H, .03), lm, W / 2, 0, -T / 2 + .015);                          // back cover

const puckA = lathe(roundDisc(.17, .056, .022), opal(), .012, lamp);
const puckB = lathe(roundDisc(.17, .056, .022), opal(), -.085, lamp);
mesh(new THREE.CylinderGeometry(.1, .1, .045, 48), opal(false), -.036, lamp);
addGlow(lamp, 1.35, -.04, 1.15); addLight(lamp, 5, -.06);
const cord = new THREE.Group(); cord.position.set(.035, .07, .02);
const CORD = .62, CY = .07;
mesh(new THREE.CylinderGeometry(.0028, .0028, CORD, 6), new THREE.MeshStandardMaterial({ color: 0xcdbb9a, roughness: .9 }), -CORD / 2, cord);
mesh(new THREE.SphereGeometry(.02, 16, 12), oak, -CORD - .015, cord);
const grab = mesh(new THREE.CylinderGeometry(.07, .07, CORD + .15, 8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }), -CORD / 2 - .04, cord);
lamp.add(cord);

// right: mushroom pendant
const lamp2 = new THREE.Group(); lamp2.position.set(2.65, 3.15, 1.6); scene.add(lamp2);
lathe([[0, 0], [.034, 0], [.04, .03], [.03, .1], [.014, .115], [0, .115]], oak, .095, lamp2, 32); mesh(new THREE.CylinderGeometry(.005, .005, 4, 8), black, 2.2, lamp2);
const mushPts = []; for (let i = 0; i <= 24; i++) { const t = i / 24 * Math.PI; const sx = Math.sin(t), cy = -Math.cos(t); mushPts.push([.215 * Math.sign(sx) * Math.abs(sx) ** .72, .125 * Math.sign(cy) * Math.abs(cy) ** .9]); }
mushPts[0][0] = 0; mushPts[mushPts.length - 1][0] = 0;
const mush = lathe(mushPts, opal(), 0, lamp2);
addGlow(lamp2, 1.5, -.02, 1.2); addLight(lamp2, 5, -.05);

// on the shelf: dome table lamp lighting the year books
const table = new THREE.Group(); table.position.set(-2.08, SHELF[1], -.55); scene.add(table);
mesh(new THREE.CylinderGeometry(.13, .14, .035, 40), black, .018, table);
mesh(new THREE.CylinderGeometry(.022, .022, .78, 16), black, .41, table);
const dome = mesh(new THREE.SphereGeometry(.3, 48, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x18130f, metalness: .55, roughness: .4, side: THREE.DoubleSide }), .78, table);
dome.scale.y = .62; mesh(new THREE.SphereGeometry(.028, 16, 12), black, .78 + .3 * .62, table);
const bulb = mesh(new THREE.SphereGeometry(.05, 20, 16), opal(), .77, table);
addGlow(table, 1.9, .55, 1.5);
const pool = new THREE.SpotLight(0xffb070, 0, 5, 1.15, .9, 1.4); pool.position.set(0, .75, 0); pool.target.position.set(0, -1, 0);
pool.userData.power = 30; table.add(pool, pool.target); lights.push(pool);

const washTex = (() => { const c = mk(256, 256), x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(232,137,74,.55)'); g.addColorStop(.45, 'rgba(214,112,58,.22)'); g.addColorStop(1, 'rgba(200,100,50,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); return tex(c); })();
const washes = [];
for (const [x, y, z, w, h] of [[-2.08, 1.0, -1.98, 3.2, 2.6], [-2.6, 3.2, -1.98, 3.4, 3.0], [2.7, 3.2, -1.98, 3.4, 3.0]]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: washTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  m.position.set(x, y, z); scene.add(m); washes.push(m);
}
const lampHits = [puckA, puckB, grab, mush, dome, bulb];

const DARK = { bg: new THREE.Color(0x120d0a), wall: new THREE.Color(0x1b120b), hemi: .55, spot: 260, exp: 1.05 };
const LIGHT = { bg: new THREE.Color(0x4e4038), wall: new THREE.Color(0x6f5f53), hemi: .8, spot: 230, exp: 1.08 };
const hemi = scene.children.find(o => o.isHemisphereLight);
let lightAmt = 0, lampOn = false;
function applyLight(a) {
  lightAmt = a;
  scene.background.copy(DARK.bg).lerp(LIGHT.bg, a); scene.fog.color.copy(scene.background);
  wall.material.color.copy(DARK.wall).lerp(LIGHT.wall, a);
  hemi.intensity = DARK.hemi + (LIGHT.hemi - DARK.hemi) * a;
  spot.intensity = DARK.spot + (LIGHT.spot - DARK.spot) * a;
  renderer.toneMappingExposure = DARK.exp + (LIGHT.exp - DARK.exp) * a;
  shades.forEach(m => m.emissiveIntensity = a * 1.5); glows.forEach(g => g.material.opacity = a * .8); washes.forEach(w => w.material.opacity = a); lights.forEach(l => l.intensity = a * l.userData.power);
}
const flick = t => t < .32 ? (Math.random() < .45 ? 0.05 : t * 1.6) * (0.6 + Math.random() * .4) : ease((t - .32) / .68) * .9 + .1;
let lampBusy = false;
async function pullCord() {
  if (lampBusy) return; lampBusy = true;
  await tween(170, t => { cord.position.y = CY - .09 * t; });
  lampOn = !lampOn;
  try { localStorage.setItem('lamp', lampOn ? 'on' : 'off'); } catch (e) {}
  document.documentElement.dataset.theme = lampOn ? 'light' : 'dark';
  const from = lightAmt;
  const spring = tween(520, t => { cord.position.y = CY - .09 * Math.exp(-5 * t) * Math.cos(t * 11); });
  if (lampOn) await tween(1900, t => applyLight(Math.max(from, flick(t))));
  else await tween(800, t => applyLight(from * (1 - t)));
  await spring; lampBusy = false;
}
try { if (localStorage.getItem('lamp') === 'on') { lampOn = true; document.documentElement.dataset.theme = 'light'; applyLight(1); } } catch (e) {}

// ---------- input ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), mouse = { x: 0, y: 0 };
const tip = $('#tip');
function overLamp(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(lampHits, false).length > 0;
}
function pick(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  if (mode === 'shelf') {
    const hit = ray.intersectObjects(yearBooks.map(b => b.book), true)[0];
    if (!hit) return { book: null };
    let o = hit.object; while (o && !yearBooks.some(b => b.book === o)) o = o.parent;
    return { book: yearBooks.find(b => b.book === o) };
  }
  if (mode === 'read' && !busy) {
    const hit = ray.intersectObjects([reading.L, reading.R])[0];
    if (!hit) return {};
    const side = hit.object === reading.L ? 'L' : 'R', x = hit.uv.x * CW, y = (1 - hit.uv.y) * CH;
    return { spot: spots[side].find(s => x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) };
  }
  return {};
}
addEventListener('pointermove', e => {
  if (demoOn) return;
  mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5;
  if (overLamp(e)) { $('#gl').style.cursor = 'grab'; tip.innerHTML = lampOn ? 'Pull to turn the lamp off' : 'Pull the cord'; tip.style.left = e.clientX + 16 + 'px'; tip.style.top = e.clientY + 16 + 'px'; tip.style.opacity = 1; hoverBook = null; return; }
  if (mode !== 'shelf') tip.style.opacity = 0;
  const r = pick(e);
  if (mode === 'shelf') {
    hoverBook = r.book;
    if (r.book) { const ds = r.book.cat ? [] : datesOf(r.book.year), n = r.book.cat ? catPages(r.book.cat).length : ds.reduce((a, d) => a + byDate[d].length, 0); tip.innerHTML = `<b>${r.book.cat ? r.book.cat.name : r.book.year}</b>${n ? `${n} pages${r.book.cat ? '' : `, ${ds.length} days`}` : 'empty so far'}`; tip.style.left = e.clientX + 16 + 'px'; tip.style.top = e.clientY + 16 + 'px'; tip.style.opacity = 1; }
    else tip.style.opacity = 0;
    $('#gl').style.cursor = r.book ? 'pointer' : 'default';
  } else if (mode === 'read' && !busy) {
    const id = r.spot ? r.spot.id : null;
    if (id !== hoverId) { hoverId = id; redraw(); }
    $('#gl').style.cursor = id ? 'pointer' : 'default';
  }
});
addEventListener('click', e => {
  if (e.target !== $('#gl') || demoOn) return;
  if (overLamp(e)) return pullCord();
  const r = pick(e);
  if (mode === 'shelf' && r.book) openBook(r.book.key);
  else if (mode === 'read' && r.spot) r.spot.go();
});
let wheelAcc = 0, wheelLock = 0;
function scrollRow(d) { const r = Math.max(0, Math.min(maxRow, camRow + d)); if (r !== camRow) { camRow = r; hoverBook = null; crumbs(); } }
addEventListener('wheel', e => { if (mode !== 'shelf') return; wheelAcc += e.deltaY; if (performance.now() < wheelLock || Math.abs(wheelAcc) < 40) return; scrollRow(Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = performance.now() + 600; }, { passive: true });
$('#home').onclick = async () => { closeLB(); if (mode === 'read' && !busy) await closeBook(); camRow = 0; crumbs(); };
addEventListener('keydown', e => { if (e.target.matches?.('input, textarea') || demoOn) return;
  if (mode === 'read' && e.key === 'ArrowRight') { e.preventDefault(); go(1); } if (mode === 'read' && e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  if (mode === 'shelf' && e.key === 'ArrowDown') { e.preventDefault(); scrollRow(1); } if (mode === 'shelf' && e.key === 'ArrowUp') { e.preventDefault(); scrollRow(-1); } if (e.key === 'Escape' || e.key === 'Backspace') back(); if (e.key === 'l' || e.key === 'L') pullCord(); });
$('#back').onclick = back;
$('#otd').textContent = `On this day · ${TODAY.getDate()} ${MS[TODAY.getMonth()]}`;
$('#otd').onclick = () => jumpTo(thisYear, todayStr);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (mode === 'read') reading.book.position.copy(readPose(reading)); });


// ---------- demo: a scripted tour to screen-record (button or /library?demo) ----------
let demoOn = false, demoCam = null, paused = false, demoStop = false, demoPromise = null, demoFrom = null, demoGrace = 0, FOG0 = [scene.fog.near, scene.fog.far];
const STOP = new Error('demo stopped');
const wait = ms => new Promise((res, rej) => { let left = ms, last = performance.now();
  const tick = () => { if (demoStop) return rej(STOP); const now = performance.now(); if (!paused) left -= now - last; last = now; left <= 0 ? res() : setTimeout(tick, 30); }; tick(); });
const ck = () => { if (demoStop) throw STOP; };
const dcur = $('#dcur'), V = (x, y, z) => new THREE.Vector3(x, y, z);
let curXY = [innerWidth / 2, innerHeight * .62];
function toScreen(w) { const v = w.clone().project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; }
function pageXY(side, x, y) { const b = reading, m = side === 'L' ? b.L : b.R, ph = b.H - .12; return toScreen(m.localToWorld(V((x / CW - .5) * b.pw, (.5 - y / CH) * ph, 0))); }
async function moveCur([x, y], ms = 650) {
  dcur.style.transition = `opacity .3s, transform ${ms}ms cubic-bezier(.45,0,.2,1)`;
  dcur.style.transform = `translate(${x - 3}px, ${y - 2}px)`; curXY = [x, y]; await wait(ms);
}
async function tap() { const i = dcur.querySelector('i'); i.classList.remove('go'); void i.offsetWidth; i.classList.add('go'); dcur.animate([{ scale: 1 }, { scale: .82 }, { scale: 1 }], { duration: 220 }); await wait(160); }
async function clickPage(side, x, y, pause = 380) {
  const s = spots[side].find(o => x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h); if (!s) return false;
  await moveCur(pageXY(side, x, y)); hoverId = s.id; redraw(); await wait(pause); await tap(); ck(); await s.go(); ck(); return true;
}
function demoPick() { // a page with a photo whose day was also written in other years
  let best = null, bs = -1;
  for (const ds of Object.keys(byDate)) {
    const y = +ds.slice(0, 4), ps = byDate[ds], md = ds.slice(5); if (!YEARS.includes(y)) continue;
    const others = YEARS.filter(yy => yy !== y && byDate[`${yy}-${md}`]);
    const sc = (ps[0].image ? 4 : ps[0].attachments?.length ? 2 : 0) + Math.min(others.length, 3) * 3 + (ps.length === 1 ? 1 : 0) + (ps[0].demo ? 0 : 1) + (y === thisYear ? 0 : .5);
    if (sc > bs) { bs = sc; best = { y, ds, others }; }
  }
  return best;
}
function demo() {
  if (demoOn || busy || !Object.keys(byDate).length) return;
  demoStop = false; paused = false; demoFrom = null; demoGrace = performance.now() + 3000;
  demoPromise = demoRun().catch(e => { if (e !== STOP) console.error(e); });
}
function setPaused(v) { paused = v; $('#dpause').classList.toggle('on', v); }
function setLamp(on) { lampOn = on; document.documentElement.dataset.theme = on ? 'light' : 'dark'; try { localStorage.setItem('lamp', on ? 'on' : 'off'); } catch (e) {} }
function endDemo(why) { // hand the library back to the person
  if (!demoOn) return;
  if (lightAmt > 0 && lightAmt < 1) { setLamp(true); applyLight(1); }
  demoStop = true; setPaused(false); demoOn = false; demoCam = null; hoverId = null;
  scene.fog.near = FOG0[0]; scene.fog.far = FOG0[1]; $('#fade').style.opacity = 0; dcur.style.opacity = 0;
  document.body.classList.remove('demo'); if (cur && !busy) redraw(); crumbs();
}
async function restartDemo() {
  endDemo(); await demoPromise;
  while (busy) await new Promise(r => setTimeout(r, 100));
  demo();
}
addEventListener('keydown', e => {
  if (!demoOn) return;
  if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); restartDemo(); }
  else if (e.key === 'Escape') { e.preventDefault(); endDemo('esc'); }
});
addEventListener('pointermove', e => { // taking the mouse stops the tour
  if (!demoOn || paused || performance.now() < demoGrace) { demoFrom = null; return; } // moving off the button right after clicking is fine
  if (!demoFrom) { demoFrom = [e.clientX, e.clientY]; return; }
  if (Math.hypot(e.clientX - demoFrom[0], e.clientY - demoFrom[1]) > 150) endDemo('mouse');
});
addEventListener('wheel', () => endDemo('wheel'), { passive: true });
addEventListener('pointerdown', e => { if (demoOn && !e.target.closest('#demo')) endDemo('click'); });
async function demoRun() {
  demoOn = true; document.body.classList.add('demo'); closeLB(); closeEditor(); tip.style.opacity = 0; hoverId = null; mouse.x = mouse.y = 0;
  const fade = $('#fade'); fade.style.transition = 'none'; fade.style.opacity = 1;
  if (mode === 'read') await closeBook(); ck();
  camRow = 0; CAM.y = 1.55; LOOK.y = 1.35; setLamp(true); applyLight(1);
  const ds = (byDate[todayStr] || []).length > 1 ? todayStr : demoPick().ds, y = +ds.slice(0, 4), b = books[y];
  camera.position.copy(CAM); camLook.copy(LOOK);
  // 1. open straight on the shelf, the cursor runs along the year books, each one slides out as it passes
  const at = yy => { const h = books[yy].holder; h.updateWorldMatrix(true, true); return toScreen(h.getWorldPosition(V(0, 0, 0)).add(V(0, .2, .3))); };
  const first = at(YEARS[0]);
  dcur.style.transition = 'none'; dcur.style.transform = `translate(${first[0] - 160}px, ${first[1] + 120}px)`; void dcur.offsetWidth;
  await wait(80); fade.style.transition = 'opacity .5s ease'; fade.style.opacity = 0; dcur.style.opacity = 1;
  await moveCur(first, 550);
  for (const yy of YEARS) { if (yy > y) break; hoverBook = books[yy]; await moveCur(at(yy), yy === YEARS[0] ? 0 : 300); await wait(yy === y ? 450 : 120); }
  // 2. pull it out
  hoverBook = b; await tap();
  dcur.style.opacity = 0; await openBook(y); ck(); dcur.style.opacity = 1; await wait(700);
  // 4. the month, then the day on the calendar
  const m = +ds.slice(5, 7) - 1;
  await clickPage('R', 70 + (m % 3) * 290 + 135, 215 + Math.floor(m / 3) * 285 + 132); await wait(800);
  const k = (new Date(y, m, 1).getDay() + 6) % 7 + +ds.slice(8) - 1;
  await clickPage('L', 85 + (k % 7) * 118 + 59, 360 + Math.floor(k / 7) * 118 + 59); await wait(1500);
  // 5. next entry, next entry, until the page that lists the whole day
  for (let i = 0; i < (byDate[ds] || []).length && i < 6; i++) { if (!await clickPage('R', CW - 170, CH - 75, 250)) break; await wait(1400); }
  hoverId = null; redraw(); dcur.style.opacity = 0; demoOn = false; crumbs(); ck();
  // stays clean for the last frame; the controls come back when the mouse moves
  setTimeout(() => addEventListener('pointermove', () => document.body.classList.remove('demo'), { once: true }), 400);
}
$('#demo').onclick = e => { e.currentTarget.blur(); demo(); };
if (new URLSearchParams(location.search).has('demo')) setTimeout(demo, 900);

// ---------- loop ----------
const clock = new THREE.Clock(), camLook = LOOK.clone(); let lastNow = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(clock.getDelta(), .05);
  if (paused) for (const tw of tweens) tw.s += now - lastNow;
  lastNow = now;
  for (const tw of tweens) { const t = Math.min(1, (now - tw.s) / tw.ms); tw.fn(ease(t)); if (t >= 1) { tweens.delete(tw); tw.r(); } }
  for (const b of yearBooks) {
    const on = mode === 'shelf' && hoverBook === b;
    b.holder.position.z += ((on ? .55 : 0) - b.holder.position.z) * Math.min(1, dt * 10);
    b.holder.rotation.x += ((on ? .07 : 0) - b.holder.rotation.x) * Math.min(1, dt * 10);
  }
  if (demoCam) { camera.position.copy(demoCam.pos); camLook.copy(demoCam.look); camera.lookAt(camLook); } else {
  const k = mode === 'shelf' ? .35 : .06;
  camera.position.x += (CAM.x + mouse.x * k - camera.position.x) * Math.min(1, dt * 3);
  camera.position.y += (CAM.y - mouse.y * k * .5 - camera.position.y) * Math.min(1, dt * 3);
  if (!paused) CAM.y += (1.55 - camRow * ROWH - CAM.y) * Math.min(1, dt * 4); LOOK.y = CAM.y - .2;
  camera.position.z += (CAM.z - camera.position.z) * Math.min(1, dt * 3);
  camLook.lerp(LOOK, Math.min(1, dt * 4)); camera.lookAt(camLook); }
  fill.position.copy(camera.position);
  lamp.rotation.z = Math.sin(now / 1400) * .004; lamp2.rotation.z = Math.sin(now / 1700 + 2) * .004; cord.rotation.z = Math.sin(now / 900 + 1) * .03;
  fill.intensity += ((mode === 'shelf' ? 0 : 2.2) - fill.intensity) * Math.min(1, dt * 3);
  renderer.render(scene, camera);
});
$('#load').style.opacity = 0; setTimeout(() => $('#load').remove(), 700);
</script>
